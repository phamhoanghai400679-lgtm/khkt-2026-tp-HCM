<!DOCTYPE html>
<html>
<head>
    <title>Rust AI</title>
</head>
<body>
    <h1>Kiểm tra mức độ gỉ sét</h1>
    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" capture="camera">
        <button type="submit">Phân tích</button>
    </form>

    {% if preview_data %}
        <h2>Ảnh preview:</h2>
        <img src="data:image/png;base64,{{ preview_data }}" alt="Preview">
    {% endif %}

    {% if probs %}
        <h2>Kết quả dự đoán:</h2>
        <ul>
            <li>Gỉ sét nhẹ: {{ probs[0] }}%</li>
            <li>Gỉ sét vừa: {{ probs[1] }}%</li>
            <li>Gỉ sét nặng: {{ probs[2] }}%</li>
        </ul>
        <p>Mức độ cao nhất: {{ max_label }}</p>
    {% endif %}
</body>
</html>
