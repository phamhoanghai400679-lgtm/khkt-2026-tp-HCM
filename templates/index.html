<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Check Iron – Kiểm tra mức độ gỉ sét</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      text-align: center;
      margin: 40px;
      color: #333;
    }
    h1 {
      color: #ff6600;
      margin-bottom: 10px;
    }
    p {
      color: #555;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .upload-btn {
      background-color: #f0f0f0;
    }
    .camera-btn {
      background-color: #e0e0ff;
    }
    .analyze-btn {
      background-color: #ff6600;
      color: white;
      font-weight: bold;
    }
    #preview {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #f8f8f8;
    }
    #errorMsg {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Phân tích bề mặt kim loại</h1>
    <p>Chụp ảnh bằng điện thoại hoặc chọn ảnh có sẵn để AI phân tích mức độ gỉ sét.</p>

    <form id="uploadForm" action="/predict" method="post" enctype="multipart/form-data">
      <!-- Chọn ảnh từ thiết bị -->
      <input type="file" id="fileInput" name="image" accept="image/*" style="display:none;">
      <label for="fileInput" class="button upload-btn">📁 Chọn ảnh từ thiết bị</label>

      <!-- Chụp ảnh bằng camera -->
      <input type="file" id="cameraInput" name="image" accept="image/*" capture="camera" style="display:none;">
      <label for="cameraInput" class="button camera-btn">📷 Chụp bằng camera</label>

      <button type="submit" class="button analyze-btn">Phân tích ảnh</button>
    </form>

    <img id="preview" src="" alt="Ảnh vừa gửi">

    <h2>Kết quả phân tích:</h2>
    <table id="resultTable" style="display:none;">
      <tr><th>Cấp độ</th><th>Tỉ lệ (%)</th></tr>
      <tr><td>Nhẹ</td><td id="light">--</td></tr>
      <tr><td>Trung bình</td><td id="medium">--</td></tr>
      <tr><td>Nặng</td><td id="severe">--</td></tr>
    </table>
    <p id="conclusion" style="font-weight:bold;">Chưa có kết quả</p>
    <p id="errorMsg"></p>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const cameraInput = document.getElementById("cameraInput");
    const preview = document.getElementById("preview");
    const form = document.getElementById("uploadForm");
    const errorMsg = document.getElementById("errorMsg");

    function showPreview(file) {
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = "block";
        }
        reader.readAsDataURL(file);
      }
    }

    // Khi chọn ảnh từ máy tính
    fileInput.addEventListener("change", function() {
      showPreview(this.files[0]);
    });

    // Khi chụp ảnh bằng camera → hiển thị và gửi form luôn
    cameraInput.addEventListener("change", function() {
      const file = this.files[0];
      if (file) {
        showPreview(file);
        sendImage(file);
      }
    });

    // Gửi form khi nhấn nút "Phân tích ảnh"
    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const file = fileInput.files[0] || cameraInput.files[0];
      if (!file) {
        errorMsg.textContent = "⚠️ Vui lòng chọn hoặc chụp ảnh trước khi phân tích.";
        return;
      }
      sendImage(file);
    });

    // Hàm gửi ảnh lên server và hiển thị kết quả
    async function sendImage(file) {
      errorMsg.textContent = "";
      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("/predict", { method: "POST", body: formData });
        const data = await response.json();

        if (data.error) {
          errorMsg.textContent = "⚠️ " + data.error;
          return;
        }

        document.getElementById("light").textContent = data["Nhẹ"] || "--";
        document.getElementById("medium").textContent = data["Trung bình"] || "--";
        document.getElementById("severe").textContent = data["Nặng"] || "--";
        document.getElementById("conclusion").textContent = data["Kết luận"] || "Không có kết quả";
        document.getElementById("resultTable").style.display = "table";
      } catch (err) {
        errorMsg.textContent = "⚠️ Lỗi kết nối hoặc định dạng dữ liệu.";
      }
    }
  </script>
</body>
</html>
