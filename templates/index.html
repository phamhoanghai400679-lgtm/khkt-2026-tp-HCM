<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Check Iron</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      margin-top: 40px;
    }
    .result {
      margin-top: 30px;
      font-size: 20px;
      color: #2c3e50;
    }
    img.preview {
      margin-top: 20px;
      max-width: 300px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>AI Check Iron</header>
  <div class="container">
    <h2>Chụp hoặc tải ảnh gỉ sắt để kiểm tra</h2>
    <form method="post" enctype="multipart/form-data">
      <!-- input có capture="camera" sẽ mở máy ảnh trên điện thoại -->
      <input type="file" id="imageInput" name="image" accept="image/*" capture="camera" required>
      <br><br>
      <img id="preview" class="preview" style="display:none;">
      <br>
      <button type="submit">Dự đoán</button>
    </form>
    <div class="result">
      {% if result %}
        Kết quả: {{ result }}
      {% else %}
        Chưa có kết quả
      {% endif %}
    </div>
  </div>

  <script>
    // Hiển thị ảnh preview ngay khi chọn/chụp
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.src = e.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
